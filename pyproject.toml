[project]
name = "pyhexagen"
version = "0.2.0"
description = "Hexagonal Architecture Scaffolding for Python/FastAPI"
requires-python = ">=3.10"
authors = [
    { name = "rbaezc", email = "raul.baez.camarillo@gmail.com" }
]
urls = { repository = "https://github.com/rbaezc/pyhexagen" }
dependencies = [
    "typer[all]>=0.9.0",
    "jinja2>=3.1.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "loguru>=0.7.0"
]

[project.scripts]
pyhexagen = "pyhexagen.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
