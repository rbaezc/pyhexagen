[project]
name = "pyhexagen"
version = "0.1.0"
description = "Hexagonal Architecture Scaffolding for Python/FastAPI"
requires-python = ">=3.10"
authors = [
    { name = "rbaezc", email = "rbaezc@gmail.com" }
]
urls = { repository = "https://github.com/rbaezc/pyhexagen" }
dependencies = [
    "typer[all]>=0.9.0",
    "jinja2>=3.1.2",
    "pydantic>=2.0.0",
    "inflect>=7.0.0",
]

[project.scripts]
pyhexagen = "pyhexagen.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyhexagen"]
